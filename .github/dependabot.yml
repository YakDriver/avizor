version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # sqlite and its runtime move together, and can change results without failing CI. Compare eval and
      # queue --all output before merging (see AGENTS.md).
      sqlite:
        patterns: ["modernc.org/*"]
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
